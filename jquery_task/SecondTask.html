
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX Form Example</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container mt-5 py-5" style="height:230px;">
    <form id="userForm" >
      <h1 class="text-center">AJAX CRUD WITH JQUERY</h1>
      <div class="form-group mt-5">
        <label for="name">Title</label>
        <input type="text" class="form-control" id="title" placeholder="Enter Title Name">
      </div>
      <div class="form-group">
        <label for="age">Price</label>
        <input type="text" class="form-control" id="price" placeholder="Enter Price">
      </div>
      <div class="form-group">
        <label for="email">Description</label>
        <input type="text" class="form-control" id="description" placeholder="Enter Description">
      </div>
      <div class="form-group">
        <label for="password">Category</label>
        <input type="text" class="form-control" id="category" placeholder="Enter Category">
      </div>
      <button type="button" class="btn btn-success mx-1 mt-3" id="submit">Submit</button>
      <button type="button" class="btn btn-primary mx-1 mt-3" id="update" style="display:none;">Save Changes</button>
    </form>
    <p id="result"></p>
    <table id="product-table" class="table table-striped">
      <thead>
        <tr>
          <th>Sr.no</th>
          <th>Title</th>
          <th>Price</th>
          <th>Description</th>
          <th>Category</th>
          <th>actions</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
    <h1 class="mt-5 text-center">All products AJAX GET Method R&D</h1>
    <p class="mypanel p-5"></p>
    <P id="result"></P>
  </div>
  <script>
    /////////////////////////////////////////////////////////////////POST METHOD USING AJAX ///////////////////////////////////////////////////
   
let id = 21;
$(document).ready(function() {
  $("#submit").click(function() {
    
    const title = $("#title").val();
    const price = $("#price").val();
    const description = $("#description").val();
    const category = $("#category").val();

    if (title === "" || price === "" || description === "" || category === "") {
      Swal.fire("Fill All the Details");
      return;
    }

    if (isNaN(price)) {
    Swal.fire("Price must be a number.");
      return;
    }


    $.ajax({
      type: "POST",
      url: "https://fakestoreapi.com/products",
      data: JSON.stringify({
        title: title,
        price: price,
        description: description,
        category: category
      }),
      contentType: "application/json",
      success: function(data) {
        $("#result").html(Swal.fire(`${title} Added SuccessFully`))
        console.log(data);
        const table = $("#product-table");
        const row = $("<tr>");
        row.append($("<td>").text(id));
        row.append($("<td>").text(data.title));
        row.append($("<td>").text(data.price));
        row.append($("<td>").text(data.description));
        row.append($("<td>").text(data.category));
        const actions = $("<td></td>");
        const EditButton = $("<button class='btn btn-warning btn-sm mx-1'>Edit</button>");
        const deleteBtn = $("<button class='btn btn-danger btn-sm mx-1'>Delete</button>");
        actions.append(EditButton)
        actions.append(deleteBtn)
        row.append(actions)
        table.append(row);
        $("#userForm")[0].reset();
        id++;
///////////////////////////////////////////////////////////////////////DELETE METHOD WITH AJAX AND SWEET ALERT MODEL//////////////////////////////////
deleteBtn.click(function() {
  const productId = data.id; 
  Swal.fire({
    title: 'Are you sure?',
    text: 'Do you really want to delete this product?',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Yes, delete it!',
    cancelButtonText: 'No, cancel!',
  }).then((result) => {
    if (result.isConfirmed) {
      $.ajax({
        type: "DELETE",
        url: `https://fakestoreapi.com/products/${id}`,
        success: function(data) {
          row.remove();
          Swal.fire('Deleted!', 'The product has been deleted.', 'success');
        }
      });
    } else {
      Swal.fire('Cancelled', 'The product was not deleted.', 'info');
    }
  });
});

      
////////////////////////////////////////////////////////////NORMAL EDIT METHOD /////////////////////////////////////////////////
        EditButton.click(function() {
          const row = $(this).closest("tr");
          $("#title").val(row.find("td:nth-child(2)").text());
          $("#price").val(row.find("td:nth-child(3)").text());
          $("#description").val(row.find("td:nth-child(4)").text());
          $("#category").val(row.find("td:nth-child(5)").text());
          $("#submit").hide();
          $("#update").show();

          $("#update").click(function() {
            row.find("td:nth-child(2)").text($("#title").val());
            row.find("td:nth-child(3)").text($("#price").val());
            row.find("td:nth-child(4)").text($("#description").val());
            row.find("td:nth-child(5)").text($("#category").val());
            Swal.fire("Data Update Successfully");
            $("#userForm")[0].reset();
            $("#submit").show();
            $("#update").hide();
          });
        });
      },
    });
  });
/////////////////////////////////////////////////GET METHOD USING AJAX ///////////////////////////////////////////
  $.ajax({
    type: 'GET',
    url: ('https://fakestoreapi.com/products?limit=6'),
    dataType: 'json',
    success: function(data) {
      const html = data.map(product => {
        return `
          <div class="col-sm-4">
            <h6><p class="${product.url}">${product.title}</p></h6>
            <p class="text-muted">Price: $${product.price}</p>
            <p class="text-muted">Description: ${product.description}</p>
            <p class="text-muted">Category: ${product.category}</p>
          </div>
        `;
      }).join('');
      $(".mypanel").html(`
        <div class="container mt-5">
          <div class="row">
            ${html}
          </div>
        </div>
      `);
    }
  });
});
</script>
</body>
</html>
