<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX Form Example</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5 ">
   
        <button id="addForm" class="btn w-100 mb-3 bg-light">
            <i class="fas fa-plus"></i> Add New Product
          </button>
        
        <i class="bi bi-file-plus-fill"></i>
    </button>
 
    <form id="userFormTemplate" class="d-none index mt-4 shadow-lg">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" class="form-control title" placeholder="Enter Title Name">
      </div>
      <div class="form-group">
        <label for="price">Price</label>
        <input type="text" class="form-control price" placeholder="Enter Price">
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" class="form-control description" placeholder="Enter Description">
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" class="form-control category" placeholder="Enter Category">
      </div>
      <button type="button" class="btn btn-success submit">Submit</button>
      <button type="button" class="btn btn-danger "id="cancel">Cancel</button>
      <button type="button" class="btn btn-primary mx-1 mt-3" id="update" style="display:none;">Save Changes</button>
  
    </form>
    <table id="productTable" class="table table-striped mt-5">
      <thead>
        <tr>
          <th>Sr.no</th>
          <th>Title</th>
          <th>Price</th>
          <th>Description</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script>

    //declare product id globally within start id of 1
    let productId = 1;
    $(document).ready(function () {

        /*on click ek navu form generate thase using clone method method channing no use karyo che 
        jenathi multiple method ek statment par execute thai sake form generate thase d-none e class remove thas
        e and form will be visible and id attribute bhi remove karse
        clone : to create multiple shollow copy of the Form
        Removeclass : this method will remove the class of d-none in the form so form will be visible
        */ 
     

     

     $("#addForm").click(function() {
         const newForm = $("#userFormTemplate").clone().removeClass("d-none").removeAttr("id");
         $(".container").append(newForm);
         newForm.find("#cancel").click(function(){ 
             newForm.hide() 
         })
     });
     

      
      $(document).on("click", ".submit", function () {
        const form = $(this).closest("form");//it will find the closest form near by 
        const title = form.find(".title").val();//it will return the child element title 
        const price = form.find(".price").val();//it will return the child element price 
        const description = form.find(".description").val();//it will return the child element description 
        const category = form.find(".category").val();//it will return the child element category

 
         //Normal Empty Validation just for to prevent store the null values 

        if (!title || !price || !description || !category) {
          Swal.fire("Please fill all the fields.");
          return;
        }
          //number validtion that only allows numers in input field 
        if (isNaN(price)) {
          Swal.fire("Price must be a number.");
          return;
        }
/////////////////////////////////////////////////////////////////////////////POST EXECUTION USING AJAX////////////////////////////////////////
        $.ajax({
          type: "POST",
          url: "https://fakestoreapi.com/products",
          data: JSON.stringify({
            title,
            price,
            description,
            category
          }),
          contentType: "application/json",
          success: function (data) {//success message will fire 
            Swal.fire("Product added successfully!");//that wull exeucte this sweet alert swal fire 
            const newRow = `
              <tr>
                <td>${productId++}</td>
                <td>${data.title}</td>
                <td>${data.price}</td>
                <td>${data.description}</td>
                <td>${data.category}</td>
                <td>
                  <button class="btn btn-warning btn-sm edit">Edit</button>
                  <button class="btn btn-danger btn-sm delete">Delete</button>
                </td>
              </tr>
            `;
            //Append will insert every new recrod inside the table body 
            $("#productTable tbody").append(newRow);
           ;//after succesfully insert the data form will be Hide
            form.remove();
          }
          
        });
      });
      

////////////////////////////////////////////////////////////////////PUT NORMAL METHOD WITH SWAL FIRE//////////////////////////
      $(document).on("click", ".edit", function() {
        const row = $(this).closest("tr");//it will find the nearst data row
        //it will return the child elment from specefic postion from row
        const title = row.find("td:nth-child(2)").text();
        const price = row.find("td:nth-child(3)").text();
        const description = row.find("td:nth-child(4)").text();
        const category = row.find("td:nth-child(5)").text();
      
         //here we create new template form for edti which is we did the reuse of code create user form and edit form 
        const form = $("#userFormTemplate").clone().removeClass("d-none").removeAttr("id");
        //this will store the values inide the edit temeplate at the specefic postion 
        form.find(".title").val(title);
        form.find(".price").val(price);
        form.find(".description").val(description);
        form.find(".category").val(category);
        form.find(".submit").hide();
        form.find("#update").show();
        form.find("#cancel").hide()
         //resuce the code of new form create in edit form creation 
        $(".container").append(form);
        //there will be update the records 
        form.find("#update").one("click", function() {
            const newTitle = form.find(".title").val();
            const newPrice = form.find(".price").val();
            const newDescription = form.find(".description").val();
            const newCategory = form.find(".category").val();
             //it will store updated records at the specefic place 
            row.find("td:nth-child(2)").text(newTitle);
            row.find("td:nth-child(3)").text(newPrice);
            row.find("td:nth-child(4)").text(newDescription);
            row.find("td:nth-child(5)").text(newCategory);
            Swal.fire("Product updated successfully!");
            form.remove();//after the suceffuly update the record it will be removed 
        });
    });
})
//////////////////////////////////////////////////////DELETE METHOD WITH SWAL FIRE MESSAGE ALERT ///////////////////////////////////////////////

      $(document).on("click", ".delete", function () {
        const row = $(this).closest("tr");//IT WILL RETURN NEARST ROW OF PRODUCTS 
        Swal.fire({//THE MESSAGE WILL BE FIRE ONCE YOU SAY YES IT WILL BE REMOVE THE ROW 
          title: "Are you sure?",
          text: "This product will be deleted.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "Yes, delete it!"
        }).then((result) => {//THEN WOULD BE USED TO HANDLE REJECTION OR SUCCESS OF DIFFER OBJECTS SINCE SWAL FIRE IS ASYNC WE CAN USE THEN
          if (result.isConfirmed) {
            row.remove();//PRODUCT WILL BE REMOVED USING METHOD REMOVE ONCE ITS CONFOMATION YES 
            Swal.fire("Product deleted successfully!");
          }
        });
      });
  </script>
</body>
</html>
