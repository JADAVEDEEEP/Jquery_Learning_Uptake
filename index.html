     //JQUERY HIDE ,SHOW AND TOGGLE METHOD

     //HIDE METHOD
       $(document).ready(function(){
        $("#btn").click(function(){
            $("h1,ul,li").hide();
        })

        //SHOW METHOD
        $(document).ready(function(){
            $("#btn2").click(function(){
                $("h1,ul,li").show();

            })

            //TOGGLE
            $(document).ready(function(){
                $("#btn3").click(function(){
                    $("h1,ul,li").toggle("slow");
    
                })
            })
        })
